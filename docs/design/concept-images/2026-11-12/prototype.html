<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge Room Â· interaction prototype</title>
<style>
:root{color-scheme:dark;--bg:#171819;--surface:#1e2021;--raised:#292b2c;--line:#393c3d;--text:#e9e9e7;--muted:#a5aaa9;--accent:#b47d63;--focus:#e4b495;font:13px/1.45 "Segoe UI",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{color:inherit;background:transparent;border:0;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}button:hover{background:#343536}button[aria-selected=true],button.active{color:#f1c6af;background:#342b27}.app{height:100dvh;display:grid;grid-template-rows:36px minmax(0,1fr) 25px;min-width:760px}.title{display:flex;align-items:center;gap:5px;padding:0 8px;border-bottom:1px solid var(--line);background:var(--surface)}.logo{font-weight:650;margin:0 14px 0 4px}.logo span{color:var(--accent)}.menu-trigger{height:29px;padding:0 9px;border-radius:3px}.title .hint{margin-left:auto;color:var(--muted)}.body{display:grid;grid-template-columns:112px var(--left-width,270px) minmax(220px,1fr) var(--right-width,320px);min-height:0}.rail{background:var(--surface);border-right:1px solid var(--line);padding:5px 3px;overflow:auto}.rail button{display:block;width:100%;min-height:34px;border-left:2px solid transparent;font-size:11px;text-align:left;padding-left:10px}.rail button.active{border-left-color:var(--accent)}.sidebar{border-right:1px solid var(--line);overflow:auto;min-width:0}.sidebar h2,.dock h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;padding:12px}.sidebar .row,.dock .row{padding:7px 12px;border-top:1px solid #2d3031}.row button{min-height:28px}.muted{color:var(--muted)}.field{display:block;width:calc(100% - 20px);margin:7px 10px;padding:7px 9px;background:#151617;border:1px solid var(--line);color:var(--text);border-radius:3px}.editor-area{display:grid;grid-template-rows:37px minmax(0,1fr) var(--bottom-height,210px);min-width:0;min-height:0}.tabs,.docktabs,.bottomtabs{display:flex;align-items:stretch;overflow:auto;scrollbar-width:thin;background:var(--surface);border-bottom:1px solid var(--line)}.tabs button,.docktabs button,.bottomtabs button{min-width:max-content;padding:0 14px;border-right:1px solid var(--line);border-bottom:2px solid transparent}.tabs button[aria-selected=true],.docktabs button[aria-selected=true],.bottomtabs button[aria-selected=true]{border-bottom-color:var(--accent);background:#242424;color:var(--text)}.editor{min-height:0;overflow:auto;padding:14px 22px;background:#1a1b1c}.crumb{font-size:11px;color:var(--muted);margin-bottom:18px}.code{font:14px/1.55 Consolas,"Cascadia Code",monospace;white-space:pre;color:#d8dbdc}.code .ln{color:#767c7e;user-select:none}.code .key{color:#cfaa91}.code .str{color:#b4c5a6}.bottom{border-top:1px solid var(--line);min-height:0;display:grid;grid-template-rows:34px minmax(0,1fr);background:#191a1b}.bottom pre{margin:0;padding:12px 16px;overflow:auto;font:12px/1.5 Consolas,monospace}.dock{border-left:1px solid var(--line);min-width:0;overflow:auto}.docktabs{height:37px}.dockcontent{padding:7px 0}.status{display:flex;align-items:center;gap:16px;padding:0 10px;border-top:1px solid var(--line);background:var(--surface);font-size:11px;color:var(--muted)}.status span:last-child{margin-left:auto}.popup{position:fixed;z-index:10;min-width:220px;max-width:min(320px,90vw);padding:4px;background:var(--raised);border:1px solid #666866;border-radius:4px;box-shadow:0 12px 30px #0008}.popup button{display:flex;justify-content:space-between;gap:18px;width:100%;min-height:30px;padding:5px 8px;text-align:left}.popup button:disabled{opacity:.45;cursor:not-allowed}.popup hr{border:0;border-top:1px solid var(--line);margin:5px 0}.popup small{color:var(--muted)}.toolbar{display:flex;gap:5px;align-items:center;padding:7px 10px}.toolbar button,.action{min-height:29px;padding:5px 9px;border:1px solid var(--line);border-radius:3px}.primary{background:#684a3d;border-color:#8c654f}.notice{padding:9px 12px;background:#28231f;border-bottom:1px solid #514136;color:#d5c2b5}.splitter{position:absolute;z-index:2;width:7px;cursor:col-resize;background:transparent}.splitter:hover,.splitter:focus-visible{background:#8f6651}dialog{border:1px solid #686a67;border-radius:6px;background:var(--raised);color:var(--text);width:min(460px,90vw);padding:18px;box-shadow:0 20px 50px #000a}dialog::backdrop{background:#0009}dialog h2{margin:0 0 8px;font-size:17px}dialog p{color:var(--muted)}dialog footer{display:flex;justify-content:flex-end;gap:8px}dialog button{min-height:32px;padding:6px 12px;border:1px solid var(--line);border-radius:3px}.toast{position:fixed;right:16px;bottom:39px;z-index:20;padding:8px 12px;border:1px solid #6b5548;background:#302924;color:var(--text);border-radius:4px}.hidden{display:none}a{color:#d7a58b}
</style>
<div class="app"><div class="title"><div class="logo"><span>â—†</span> Forge Room</div><button class="menu-trigger" data-menu="File">File</button><button class="menu-trigger" data-menu="Edit">Edit</button><button class="menu-trigger" data-menu="View">View</button><span class="hint">Interaction prototype Â· no live files or network</span><button class="menu-trigger" id="reset">Reset layout</button></div><div class="body" id="body"><nav class="rail" id="rail" aria-label="Primary views"></nav><aside class="sidebar" id="sidebar" aria-live="polite"></aside><main class="editor-area"><div class="tabs" id="tabs" role="tablist" aria-label="Editor tabs"></div><section class="editor" id="editor"></section><div class="bottom" id="bottom"><div class="bottomtabs" id="bottomtabs" role="tablist" aria-label="Bottom panel tabs"></div><div id="bottomcontent"></div></div></main><aside class="dock" id="dock"><div class="docktabs" id="docktabs" role="tablist" aria-label="Room tabs"></div><div class="dockcontent" id="dockcontent"></div></aside></div><footer class="status"><span id="statusLeft">Local workspace Â· no sharing</span><span>main</span><span>UTF-8</span><span>Rust</span><span>Ln 15, Col 13</span></footer></div>
<div class="popup hidden" id="popup" role="menu"></div><dialog id="confirm"><h2 id="confirmTitle">Confirm</h2><p id="confirmText"></p><footer><button id="cancel">Cancel</button><button class="primary" id="confirmAction">Confirm</button></footer></dialog><div class="toast hidden" id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id),state={rail:'Code',dock:'Team',bottom:'Terminal',tab:'main.rs',menu:null,search:'',taskStatus:'All',roomMode:'Local only',right:true,bottomOpen:true};
const rails=['Code','Search','Rooms','Studio','Workflows','Models','Source Control','Run & Debug','Tests','Extensions','Settings','Accessibility'];const docks=['Team','Chat','Agents','Tasks','Activity'];const bottoms=['Terminal','Output','Problems'];const tabs=['main.rs','rooms.rs','README.md'];
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function render(){ $('rail').replaceChildren(...rails.map(n=>{let b=document.createElement('button');b.textContent=n;b.title=n;b.className=state.rail===n?'active':'';b.onclick=()=>{state.rail=n;render()};return b}));$('tabs').replaceChildren(...tabs.map(n=>{let b=document.createElement('button');b.textContent=n+(n==='rooms.rs'?' â—':'');b.setAttribute('role','tab');b.setAttribute('aria-selected',String(state.tab===n));b.onclick=()=>{state.tab=n;render()};return b}));$('docktabs').replaceChildren(...docks.map(n=>{let b=document.createElement('button');b.textContent=n;b.setAttribute('role','tab');b.setAttribute('aria-selected',String(state.dock===n));b.onclick=()=>{state.dock=n;render()};return b}));$('bottomtabs').replaceChildren(...bottoms.map(n=>{let b=document.createElement('button');b.textContent=n;b.setAttribute('role','tab');b.setAttribute('aria-selected',String(state.bottom===n));b.onclick=()=>{state.bottom=n;render()};return b}));$('dock').hidden=!state.right;$('bottom').hidden=!state.bottomOpen;$('body').style.gridTemplateColumns=state.right?'112px var(--left-width,270px) minmax(220px,1fr) var(--right-width,320px)':'112px var(--left-width,270px) minmax(220px,1fr)';renderSidebar();renderEditor();renderDock();renderBottom()}
function row(s){return `<div class="row">${s}</div>`}function renderSidebar(){let n=state.rail,h=`<h2>${n}</h2>`;switch(n){case'Code':h+=`<div class="toolbar"><button class="action" data-act="new">New file</button><button class="action" data-act="more">Â·Â·Â·</button></div>${['â–¾ forge-room','  â–¾ native','    â–¾ forge-room-app','      main.rs','      rooms.rs','  â–¸ docs','  README.md'].map(row).join('')}`;break;case'Search':h+=`<input class="field" id="query" placeholder="Search files" value="${state.search}"><input class="field" placeholder="Replace" aria-label="Replace"><div class="toolbar"><button class="action" data-act="case">Aa</button><button class="action" data-act="word">Whole word</button><button class="action" data-act="regex">.*</button></div>${state.search?row(`Result in rooms.rs Â· ${state.search}`):row('<span class="muted">Enter a query to search the workspace.</span>')}`;break;case'Rooms':h+=`<div class="notice">Local room Â· no network sharing</div><div class="toolbar"><button class="action primary" data-act="create">Create room</button><button class="action" data-act="join">Join</button></div>${row('Recent rooms')}${row('Forge Room Â· local project')}`;break;case'Studio':h+=row('Theme Â· Graphite')+row('Preview before applying')+`<div class="toolbar"><button class="action" data-act="theme">Choose theme</button></div>`;break;case'Workflows':h+=row('Rust Â· cargo check')+row('Rust Â· cargo test')+row('Node Â· npm test')+`<div class="toolbar"><button class="action" data-act="run">Run in Terminal</button></div>`;break;case'Models':h+=`<div class="notice">In-app AI work is paused.</div>`+row('Local tools Â· availability only');break;case'Source Control':h+=row('main Â· 2 changes')+row('M  rooms.rs')+row('M  README.md')+`<div class="toolbar"><button class="action" data-act="diff">Open diff</button><button class="action" data-act="gitmore">Â·Â·Â·</button></div>`;break;case'Run & Debug':h+=row('Run project')+row('Debugger adapter unavailable')+`<div class="toolbar"><button class="action" data-act="run">Run in Terminal</button></div>`;break;case'Tests':h+=row('cargo test Â· discovered command')+row('No test run in this prototype')+`<div class="toolbar"><button class="action" data-act="run">Run in Terminal</button></div>`;break;case'Extensions':h+=row('Themes and snippets Â· declarative')+row('Language servers Â· external tool')+row('VSIX execution unavailable');break;case'Settings':h+=row('Appearance')+row('Editor font size 14')+row('Terminal font size 13')+row('Auto Save Â· Off')+`<div class="toolbar"><button class="action" data-act="reset">Reset settings</button></div>`;break;case'Accessibility':h+=row('Keyboard focus Â· visible')+row('Reduced motion Â· On')+row('High contrast Â· available')+row('Display scaling Â· use Windows settings');break} $('sidebar').innerHTML=h;let q=$('query');if(q)q.oninput=e=>{state.search=e.target.value;renderSidebar()};$('sidebar').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act,b))}
function renderEditor(){let content=state.tab==='README.md'?'# Forge Room\n\nNative IDE concept preview.\n\nThis page is a local interaction prototype.':'use forge_room::workspace::Workspace;\n\nfn main() -> Result<()> {\n    let workspace = Workspace::open()?;\n    // Review the room state before sharing.\n    workspace.run()?;\n    Ok(())\n}';$('editor').innerHTML=`<div class="crumb">forge-room â€º ${state.tab}</div><div class="code">${content.split('\n').map((line,i)=>`<span class="ln">${String(i+1).padStart(2,' ')}  </span>${line.replaceAll('<','&lt;')}\n`).join('')}</div>`}
function renderDock(){let h='';switch(state.dock){case'Team':h='<div class="notice">Local room Â· no live presence</div>'+row('Owner Â· You')+row('Participant Â· Atul')+row('Agent identities Â· local records');break;case'Chat':h='<div class="notice">Public local messages only</div>'+row('You Â· Decision: use the narrow dock')+row('Linked to task: Review layout')+`<input class="field" placeholder="Search local messages"><input class="field" placeholder="Write a message"><div class="toolbar"><button class="action primary" data-act="send">Post locally</button></div>`;break;case'Agents':h=row('Local identity Â· Agent A')+row('Owner Â· You')+row('Runtime Â· none connected')+row('No agent execution in this prototype');break;case'Tasks':h=`<div class="toolbar"><button class="action" data-act="taskfilter">Status: ${state.taskStatus} â–¾</button><button class="action" data-act="owner">Owner â–¾</button></div>`+row('Review layout Â· In progress')+row('Dependency Â· Design pass')+row('Evidence Â· screenshot review')+`<div class="toolbar"><button class="action" data-act="evidence">Evidence type â–¾</button><button class="action" data-act="handoff">Handoff â–¾</button></div>`;break;case'Activity':h=`<div class="toolbar"><button class="action" data-act="activityfilter">Filter â–¾</button></div>`+row('10:34 Â· You opened the project')+row('10:20 Â· Task updated')+row('No network event stream');break}$('dockcontent').innerHTML=h;$('dockcontent').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act,b))}
function renderBottom(){let h=state.bottom==='Terminal'?'<pre>PS C:\\forge-room&gt; cargo check\nChecking forge-room-core\nFinished Â· local example output</pre>':state.bottom==='Output'?'<pre>Output source: current terminal screen\nNo background process is running.</pre>':'<pre>Problems are terminal-derived in the current native preview.\nNo visible error lines.</pre>';$('bottomcontent').innerHTML=h}
const menus={File:[['New File','Ctrl+N','new'],['Open Fileâ€¦','Ctrl+O','open'],['Open Folderâ€¦','Ctrl+Shift+O','open'],['Open Recent â–¸','','recent'],['â€”'],['Save','Ctrl+S','save'],['Save Asâ€¦','Ctrl+Shift+S','save'],['Auto Save','','autosave'],['â€”'],['Close Tab','Ctrl+W','close'],['Exit','','exit']],Edit:[['Find','Ctrl+F','find'],['Replace','Ctrl+H','find'],['Go to Lineâ€¦','Ctrl+G','goto'],['Go to Fileâ€¦','Ctrl+P','goto']],View:[['Explorer','Ctrl+Shift+E','Code'],['Search','Ctrl+Shift+F','Search'],['Source Control','Ctrl+Shift+G','Source Control'],['Room','Ctrl+Shift+R','Rooms'],['â€”'],['Terminal','Ctrl+`','terminal'],['Right dock','','right'],['Reset Layout','','layout'],['Color Themeâ€¦','','theme']]};
let menuTrigger=null;function menu(anchor,entries){closeMenu();menuTrigger=anchor;let p=$('popup');p.innerHTML=entries.map(([name,shortcut,act])=>name==='â€”'?'<hr>':`<button role="menuitem" data-act="${act||name}"><span>${name}</span><small>${shortcut||''}</small></button>`).join('');let r=anchor.getBoundingClientRect();p.style.left=Math.min(r.left,innerWidth-245)+'px';p.style.top=Math.min(r.bottom+3,innerHeight-entries.length*31-12)+'px';p.classList.remove('hidden');p.querySelectorAll('button').forEach(b=>b.onclick=()=>{closeMenu();action(b.dataset.act,b)});p.querySelector('button')?.focus()}
function closeMenu(){ $('popup').classList.add('hidden');if(menuTrigger){menuTrigger.focus();menuTrigger=null}}function confirmAction(title,text,fn){$('confirmTitle').textContent=title;$('confirmText').textContent=text;$('confirmAction').onclick=()=>{$('confirm').close();fn()};$('confirm').showModal()}
function action(a,anchor){if(rails.includes(a)){state.rail=a;render();return}switch(a){case'more':menu(anchor,[['New File Here','','new'],['New Folder','','folder'],['Rename','','rename'],['Copy Path','','copy'],['â€”'],['Deleteâ€¦','','delete']]);return;case'gitmore':menu(anchor,[['Fetch','','fetch'],['Pull','','pull'],['Push','','push'],['Stash','','stash']]);return;case'taskfilter':menu(anchor,['All','Open','In progress','Blocked','Done'].map(x=>[x,'','filter:'+x]));return;case'owner':menu(anchor,[['All owners','','select'],['You','','select'],['Atul','','select']]);return;case'evidence':menu(anchor,[['Test result','','select'],['Diff','','select'],['Screenshot','','select'],['Link','','select']]);return;case'handoff':menu(anchor,[['You','','select'],['Atul','','select']]);return;case'activityfilter':menu(anchor,[['All events','','select'],['Tasks','','select'],['Git','','select']]);return;case'recent':menu(anchor,[['forge-room-ide','','select'],['Sample project','','select']]);return;case'delete':confirmAction('Delete selected file?','This prototype will not change files.',()=>toast('No file was deleted.'));return;case'right':state.right=!state.right;render();return;case'terminal':state.bottomOpen=!state.bottomOpen;render();return;case'layout':case'reset':document.documentElement.style.removeProperty('--left-width');document.documentElement.style.removeProperty('--right-width');state.right=true;state.bottomOpen=true;render();toast('Layout reset');return;case'find':state.rail='Search';render();$('query')?.focus();return;case'run':state.bottom='Terminal';state.bottomOpen=true;render();toast('Concept only: no command was run');return;case'create':confirmAction('Create local room?','Prototype only. No room will be created.',()=>toast('Concept only: no room was created.'));return;case'exit':confirmAction('Exit Forge Room?','This browser prototype cannot close the native app.',()=>toast('Prototype remains open.'));return;default:if(a.startsWith('filter:')){state.taskStatus=a.slice(7);render();return}toast('Concept only: '+a.replaceAll('-',' '))}}
document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>menu(b,menus[b.dataset.menu]));$('reset').onclick=()=>action('layout');$('cancel').onclick=()=>$('confirm').close();document.addEventListener('pointerdown',e=>{if(!$('popup').contains(e.target)&&!e.target.closest('[data-menu]')&&!e.target.closest('[data-act]'))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();if(!$('popup').classList.contains('hidden')){let bs=[...$('popup').querySelectorAll('button')],i=bs.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();bs[(i+1)%bs.length]?.focus()}if(e.key==='ArrowUp'){e.preventDefault();bs[(i-1+bs.length)%bs.length]?.focus()}}});
function tabKeys(id,values,key){$(id).addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;e.preventDefault();let i=values.indexOf(state[key]);i=e.key==='Home'?0:e.key==='End'?values.length-1:(i+(e.key==='ArrowRight'?1:-1)+values.length)%values.length;state[key]=values[i];render();$(id).querySelectorAll('button')[i]?.focus()})}tabKeys('tabs',tabs,'tab');tabKeys('docktabs',docks,'dock');tabKeys('bottomtabs',bottoms,'bottom');render();
</script></html>
